<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>團購工具</title>
<!-- Excel 讀寫（取代 pandas / openpyxl），需連網載入 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root { --primary:#4a90e2; --bg:#f4f4f9; --card:#fff; --text:#333; }
  * { box-sizing:border-box; }
  body { font-family:"Segoe UI","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--text);
         margin:0; padding:16px; min-height:100vh; display:flex; flex-direction:column; }
  .app { background:var(--card); max-width:1100px; width:100%; margin:0 auto; border-radius:10px;
         box-shadow:0 4px 15px rgba(0,0,0,.1); flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .tabs { display:flex; background:#e9ecf3; border-bottom:2px solid var(--primary); }
  .tab-btn { flex:1; padding:12px 8px; border:none; background:transparent; font-size:16px; cursor:pointer; color:#555; }
  .tab-btn:hover { background:#dde3ef; }
  .tab-btn.active { background:var(--primary); color:#fff; font-weight:bold; }
  .tab-panel { display:none; padding:20px; }
  .tab-panel.active { display:block; }
  h3.title { margin:0 0 12px; color:var(--primary); }
  label.section-title { display:block; margin:8px 0; font-weight:bold; }
  input[type=text], textarea, select { border:1px solid #ccc; border-radius:5px; padding:8px; font-size:16px; }
  textarea { width:100%; resize:vertical; }
  button { padding:8px 18px; border:none; border-radius:5px; font-size:15px; cursor:pointer; background:var(--primary); color:#fff; }
  button:hover { filter:brightness(.92); }
  .btn-green { background:#28a745; } .btn-red { background:#dc3545; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  .center { justify-content:center; }
  table { border-collapse:collapse; margin-top:10px; }
  th, td { border:1px solid #ddd; padding:8px 12px; text-align:center; }
  th { background:var(--primary); color:#fff; }
  tr:nth-child(even) { background:#f9f9f9; }
  .table-wrap { overflow:auto; max-height:420px; border:1px solid #ddd; }
  .table-wrap table { margin:0; width:100%; }
  /* 表單 */
  #f-item { font-family:Consolas,monospace; font-size:20px; width:100%; max-width:700px; }
  #f-post { font-family:Consolas,monospace; font-size:20px; height:240px; }
  /* 統計 */
  #s-wrap { max-width:520px; margin:0 auto; }
  #s-input { height:200px; }
  #s-table { width:260px; margin:10px auto; }
  /* 訊息 */
  .m-main { display:flex; gap:10px; height:480px; }
  .m-left { width:260px; border:2px solid #ccc; border-radius:6px; display:flex; flex-direction:column; padding:6px; }
  .m-right { flex:1; border:2px solid #ccc; border-radius:6px; display:flex; flex-direction:column; padding:6px; }
  #m-list { list-style:none; margin:0; padding:0; overflow:auto; flex:1; font-size:16px; border:1px solid #ddd; }
  #m-list li { padding:4px 8px; cursor:pointer; }
  #m-list li:hover { background:#e8f0fb; }
  #m-list li.sel { outline:2px solid var(--primary); outline-offset:-2px; background:#cfe2fa; }
  #m-list li.copied { background:#000; color:#fff; }
  #m-detail { flex:1; width:100%; resize:none; font-size:15px; }
  #m-search { flex:1; min-width:120px; }
  #status { max-width:1100px; width:100%; margin:6px auto 0; padding:4px 8px; color:#555; font-size:14px; }
  .toast { position:fixed; bottom:40px; left:50%; transform:translateX(-50%); background:#333; color:#fff;
           padding:10px 20px; border-radius:5px; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<div class="app">
  <div class="tabs">
    <button class="tab-btn active" data-tab="tab-form">團購訂單表產生器</button>
    <button class="tab-btn" data-tab="tab-msg">訂購訊息生成器</button>
    <button class="tab-btn" data-tab="tab-stat">Order Counter</button>
  </div>

  <!-- ═════════ Tab 1：團購訂單表產生器（表單.py） ═════════ -->
  <div id="tab-form" class="tab-panel active">
    <label class="section-title" style="font-size:20px">商品名稱：</label>
    <input type="text" id="f-item">
    <label class="section-title" style="font-size:20px">貼文內容：</label>
    <textarea id="f-post"></textarea>
    <div class="row">
      <button id="f-add">新增商品</button>
      <button id="f-export">匯出 Excel</button>
    </div>
    <div class="table-wrap"><table id="f-table"><thead></thead><tbody></tbody></table></div>
  </div>

  <!-- ═════════ Tab 2：訂購訊息生成器（訊息.py） ═════════ -->
  <div id="tab-msg" class="tab-panel">
    <div class="row">
      <button id="m-upload">上傳 Excel 檔案</button>
      <input type="file" id="m-file" accept=".xlsx,.xls" style="display:none">
      <span>搜尋訂購人：</span>
      <input type="text" id="m-search">
      <span>依產品排序:</span>
      <select id="m-sortsel" style="min-width:150px"></select>
      <button id="m-sort">排序</button>
      <button id="m-export">匯出訊息</button>
    </div>
    <div class="m-main">
      <div class="m-left"><div style="margin:4px">訂購人列表</div><ul id="m-list"></ul></div>
      <div class="m-right">
        <div style="margin:4px">訂購訊息</div>
        <textarea id="m-detail" readonly></textarea>
        <div class="row center">
          <button id="m-copy">複製訊息</button>
          <button id="m-edit">編輯訂單</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═════════ Tab 3：數量統計（統計.py） ═════════ -->
  <div id="tab-stat" class="tab-panel">
    <div id="s-wrap">
      <label class="section-title">請輸入留言資料：</label>
      <textarea id="s-input"></textarea>
      <div class="row center">
        <label><input type="radio" name="s-mode" value="product" checked> 依產品統計 (A+1)</label>
        <label><input type="radio" name="s-mode" value="total"> 僅計算 +n 總量</label>
      </div>
      <table id="s-table"><thead><tr><th>產品</th><th>數量</th></tr></thead><tbody></tbody></table>
      <div class="row center">
        <button id="s-calc">計算統計</button>
        <button id="s-copy" class="btn-green">複製結果</button>
        <button id="s-clear" class="btn-red">清除</button>
      </div>
    </div>
  </div>
</div>
<div id="status">準備就緒</div>
<div id="toast" class="toast"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);

/* ── 共用工具 ─────────────────────────────────────────── */
function cpCmp(a, b) {               // 依 Unicode code point 比較（同 Python 字串排序）
  const A = Array.from(String(a)), B = Array.from(String(b));
  const n = Math.min(A.length, B.length);
  for (let i = 0; i < n; i++) {
    const d = A[i].codePointAt(0) - B[i].codePointAt(0);
    if (d) return d;
  }
  return A.length - B.length;
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = s; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
}
function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a);
  a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ── Tab 切換 ─────────────────────────────────────────── */
document.querySelectorAll(".tab-btn").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === b.dataset.tab));
}));

/* ═════════════════════════════════════════════════════════
   Tab 1：團購訂單表產生器（對應 表單.py v2.8）
   ═════════════════════════════════════════════════════════ */
const OrderParser = {
  RE_NAME_PLUS: /^([\u4e00-\u9fa5A-Za-z\s·._-]+?)\s+\+\s*([0-9]+)\s*$/,
  RE_NAME_LINE: /^[\u4e00-\u9fa5A-Za-z\s·._-]+$/,
  RE_PURE_NUM: /^\s*\+?\s*([0-9]+)\s*$/,
  RE_ANY_LETTER_PLUS: /[A-Za-z]\s*\+\s*\p{Nd}+/u,
  RE_TIME: /^(\p{Nd}+\s*(天|日|週|周|小時|分鐘)|\p{Nd}{4}年\p{Nd}{1,2}月\p{Nd}{1,2}日(\s*星期[一二三四五六日天])?(\s*(上午|下午|中午|晚上|凌晨|傍晚)?\s*\p{Nd}{1,2}:\p{Nd}{2})?)$/u,
  NOISE_WORDS: new Set(["回覆", "讚", "翻譯年糕", "·", "Facebook"]),

  parse(text) {
    const buyers = new Map();
    let currentName = null;
    for (let line of text.split(/\r\n|\r|\n/)) {
      line = line.trim();
      if (!line || line.includes("已編輯") || this.NOISE_WORDS.has(line) || this.RE_TIME.test(line)) continue;
      if (currentName) {
        this._handleQtyLine(buyers, currentName, line);
        currentName = null;
        continue;
      }
      const mp = this.RE_NAME_PLUS.exec(line);
      if (mp) { this.mergeValue(buyers, mp[1].trim(), parseInt(mp[2], 10)); continue; }
      if (this.RE_NAME_LINE.test(line)) currentName = line;
    }
    return buyers;
  },
  _handleQtyLine(buyers, name, line) {
    const m = this.RE_PURE_NUM.exec(line);
    if (m && !this.RE_ANY_LETTER_PLUS.test(line)) this.mergeValue(buyers, name, parseInt(m[1], 10));
    else this.mergeValue(buyers, name, line);
  },
  // target 為 Map 或 plain object
  mergeValue(target, key, newVal) {
    const isMap = target instanceof Map;
    const old = isMap ? target.get(key) : target[key];
    let v;
    if (old === undefined || old === "") v = newVal;
    else if (typeof old === "number" && typeof newVal === "number") v = old + newVal;
    else v = [...new Set([String(old).trim(), String(newVal).trim()])].sort(cpCmp).join(",");
    if (isMap) target.set(key, v); else target[key] = v;
  },
};

function getSortKey(text) {          // 英文優先，中文在後
  const first = Array.from(text.trimStart())[0];
  if (/^[A-Za-z]$/.test(first)) return [0, text.toLowerCase()];
  return [1, text];
}
function sortKeyCmp(a, b) {
  const ka = getSortKey(a), kb = getSortKey(b);
  return (ka[0] - kb[0]) || cpCmp(ka[1], kb[1]);
}

const formData = new Map();          // 姓名 -> {商品: 值}
let formDf = null;                   // {cols:[...], rows:[[...]]}

function refreshFormTable() {
  const items = new Set();
  formData.forEach(o => Object.keys(o).forEach(k => items.add(k)));
  const allItems = [...items].sort(sortKeyCmp);
  const allBuyers = [...formData.keys()].sort(sortKeyCmp);
  const cols = ["姓名", ...allItems];
  const rows = allBuyers.map(b => [b, ...allItems.map(i => (formData.get(b)[i] !== undefined ? formData.get(b)[i] : ""))]);
  formDf = { cols, rows };
  const thead = document.querySelector("#f-table thead"), tbody = document.querySelector("#f-table tbody");
  thead.innerHTML = ""; tbody.innerHTML = "";
  const tr = thead.insertRow();
  cols.forEach(c => { const th = document.createElement("th"); th.textContent = c;
    th.style.minWidth = Math.max(100, Math.floor(c.length * 14)) + "px"; tr.appendChild(th); });
  rows.forEach(r => { const row = tbody.insertRow(); r.forEach(v => { row.insertCell().textContent = v; }); });
}

$("f-add").addEventListener("click", () => {
  const itemName = $("f-item").value.trim();
  if (!itemName) { alert("缺少商品名稱\n\n請輸入『商品名稱』"); return; }
  const parsed = OrderParser.parse($("f-post").value);
  if (parsed.size === 0) { alert("無符合格式\n\n找不到任何有效訂購資訊"); return; }
  parsed.forEach((val, buyer) => {
    if (!formData.has(buyer)) formData.set(buyer, {});
    OrderParser.mergeValue(formData.get(buyer), itemName, val);
  });
  $("f-item").value = "";
  $("f-post").value = "";
  refreshFormTable();
});

$("f-export").addEventListener("click", () => {
  if (!formDf || formDf.rows.length === 0) { alert("無資料\n\n目前沒有可匯出的資料"); return; }
  // 與原程式相同：最前面多一個空白欄，姓名欄標題為空白
  const aoa = [["", "", ...formDf.cols.slice(1)], ...formDf.rows.map(r => ["", ...r])];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
  XLSX.writeFile(wb, "訂單表.xlsx");
  alert("已匯出\n\n檔案已下載：訂單表.xlsx");
});

/* ═════════════════════════════════════════════════════════
   Tab 2：訂購訊息生成器（對應 訊息.py）
   ═════════════════════════════════════════════════════════ */
const MSG = {
  columns: null, rows: null,         // rows[0] 為價格列
  messages: new Map(),               // 姓名 -> 訊息
  orderDetails: new Map(),           // 姓名 -> Map(產品 -> 數量)
  copied: new Set(),
  editing: false,
  selected: null,                    // 目前選取的姓名
  filterTimer: null,
  visible: [],                       // 目前列表中的姓名
};

function setStatus(msg, duration = 5000) {
  $("status").textContent = msg;
  setTimeout(() => { $("status").textContent = "準備就緒"; }, duration);
}

const isNA = v => v === null || v === undefined || (typeof v === "number" && isNaN(v));
function cellStr(v) {
  if (v instanceof Date) {
    const p = n => String(n).padStart(2, "0");
    return `${v.getFullYear()}-${p(v.getMonth() + 1)}-${p(v.getDate())} ${p(v.getHours())}:${p(v.getMinutes())}:${p(v.getSeconds())}`;
  }
  return String(v);
}
function pyFloat(v) {                // 模擬 Python float()；失敗回傳 null
  if (typeof v === "number") return v;
  if (typeof v === "boolean") return v ? 1 : 0;
  const s = String(v).trim().replace(/(\d)_(?=\d)/g, "$1");
  if (/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s)) return parseFloat(s);
  return null;
}

function parseOrderQuantity(raw) {
  if (isNA(raw) || String(raw).trim() === "") return [0, "你沒訂"];
  const n = pyFloat(raw);
  if (n !== null) return [n, n];       // 整數與浮點數在 JS 皆以最短形式輸出
  return [raw, cellStr(raw).trim()];
}

function loadWorkbook(buf) {
  const wb = XLSX.read(buf, { type: "array", cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  let aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true, blankrows: true });
  // 去除結尾空白列（同 pandas）
  while (aoa.length && aoa[aoa.length - 1].every(isNA)) aoa.pop();
  if (!aoa.length) return { columns: [], rows: [] };
  let width = 0;
  aoa.forEach(r => { let w = r.length; while (w > 0 && isNA(r[w - 1])) w--; width = Math.max(width, w); });
  const header = [], seen = new Map();
  for (let i = 0; i < width; i++) {      // 欄名：空白 -> Unnamed: i，重複 -> name.1
    let name = isNA(aoa[0][i]) ? `Unnamed: ${i}` : cellStr(aoa[0][i]);
    if (seen.has(name)) { const c = seen.get(name); seen.set(name, c + 1); name = `${name}.${c}`; }
    else seen.set(name, 1);
    header.push(name);
  }
  const rows = aoa.slice(1).map(r => { const o = []; for (let i = 0; i < width; i++) o.push(r[i] === undefined ? null : r[i]); return o; });
  return { columns: header, rows };
}

function pad2(n) { return String(n).padStart(2, "0"); }

function generateOrderMessages() {
  if (!MSG.columns || MSG.rows.length === 0 || MSG.columns.length === 0) return;
  MSG.messages.clear(); MSG.orderDetails.clear();
  const d = new Date();
  const today = `${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}`;
  const priceRow = MSG.rows[0];
  for (const row of MSG.rows.slice(1)) {
    const nameRaw = row[1] === null || row[1] === undefined ? "" : row[1];
    if (!cellStr(nameRaw).trim()) continue;
    const name = cellStr(nameRaw);
    const lines = [`*熊熊媽團團轉${today}訂購清單*`, "", "#取貨時間三點到七點", "#本日到貨狀況請留意公告",
                   "================", `訂購人：${name}`];
    let hasOrder = false;
    const orderItems = [], productQuantities = new Map();
    for (let c = 2; c < row.length; c++) {
      const itemName = MSG.columns[c];
      const rawPrice = priceRow[c];
      let priceStr;
      if (isNA(rawPrice) || cellStr(rawPrice).trim() === "") priceStr = "無價格";
      else {
        const np = pyFloat(cellStr(rawPrice));
        if (np === null) priceStr = cellStr(rawPrice);
        else priceStr = Number.isInteger(np) ? String(np) : np.toFixed(2);
      }
      const rawQ = isNA(row[c]) ? "" : row[c];
      const [quantity, itemQuantity] = parseOrderQuantity(rawQ);
      productQuantities.set(itemName, quantity);
      if ((typeof quantity === "number" && quantity > 0) ||
          (typeof quantity !== "number" && !["", "0"].includes(cellStr(quantity).trim()))) {
        hasOrder = true;
        orderItems.push([itemName, priceStr, itemQuantity]);
      }
    }
    MSG.orderDetails.set(name, productQuantities);
    if (hasOrder) {
      orderItems.sort((a, b) => cpCmp(a[0], b[0]));
      for (const [n, p, q] of orderItems) lines.push(`訂購商品：${n}`, `品項單價：${p}`, `數量品項：${q}`, "----------------");
      lines.push("已讀請回覆訊息喔~");
      MSG.messages.set(name, lines.join("\n"));
    }
  }
}

function renderList(names) {
  MSG.visible = names; MSG.selected = null;     // 重建列表後選取會消失（同 Listbox）
  const ul = $("m-list"); ul.innerHTML = "";
  names.forEach(n => {
    const li = document.createElement("li");
    li.textContent = n;
    if (MSG.copied.has(n)) li.classList.add("copied");
    li.addEventListener("click", () => selectName(n, li));
    ul.appendChild(li);
  });
}
const sortedNames = () => [...MSG.messages.keys()].sort(cpCmp);
function populateOrderList() { renderList(sortedNames()); }
function filterOrders() {
  const term = $("m-search").value.trim().toLowerCase();
  renderList(sortedNames().filter(n => n.toLowerCase().includes(term)));
}
function selectName(name, li) {
  document.querySelectorAll("#m-list li").forEach(x => x.classList.remove("sel"));
  li.classList.add("sel");
  MSG.selected = name;
  $("m-detail").value = MSG.messages.get(name) || "";
}

function updateProductSortOptions() {
  if (!MSG.columns) return;
  const names = ["依字母排序", ...MSG.columns.slice(2)];
  const sel = $("m-sortsel"); sel.innerHTML = "";
  names.forEach(n => { const o = document.createElement("option"); o.value = n; o.textContent = n; sel.appendChild(o); });
  sel.value = names[0];
}

$("m-upload").addEventListener("click", () => $("m-file").click());
$("m-file").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const { columns, rows } = loadWorkbook(await file.arrayBuffer());
    MSG.columns = columns; MSG.rows = rows;
    generateOrderMessages();
    populateOrderList();
    updateProductSortOptions();
    setStatus("Excel檔案上傳成功");
  } catch (err) {
    alert("錯誤\n\n讀取檔案時出現錯誤：" + (err && err.message ? err.message : err));
    setStatus("檔案讀取失敗");
  }
});

$("m-search").addEventListener("keyup", () => {
  clearTimeout(MSG.filterTimer);
  MSG.filterTimer = setTimeout(filterOrders, 300);
});

$("m-copy").addEventListener("click", async () => {
  if (MSG.selected === null) { setStatus("請先選擇一個訂購人。"); return; }
  const message = MSG.messages.get(MSG.selected) || "";
  if (message) {
    await copyText(message);
    setStatus("訊息已複製到剪貼簿");
    document.querySelectorAll("#m-list li").forEach(li => { if (li.textContent === MSG.selected) li.classList.add("copied"); });
    MSG.copied.add(MSG.selected);
  } else setStatus("無法複製空訊息");
});

$("m-edit").addEventListener("click", () => {
  if (MSG.selected === null) { setStatus("請先選擇一個訂購人。"); return; }
  const ta = $("m-detail");
  if (!MSG.editing) {
    ta.readOnly = false; $("m-edit").textContent = "儲存訂單"; MSG.editing = true;
    setStatus("編輯模式：請修改訂單內容後按儲存");
  } else {
    const t = ta.value.trim();
    if (t) {
      MSG.messages.set(MSG.selected, t);
      ta.readOnly = true; $("m-edit").textContent = "編輯訂單"; MSG.editing = false;
      setStatus(`訂單 ${MSG.selected} 已更新`);
    } else setStatus("訂單內容不可為空");
  }
});

$("m-sort").addEventListener("click", () => {
  const product = $("m-sortsel").value;
  if (!product) { alert("提示\n\n請先選擇一個產品。"); return; }
  const hasOrder = name => {
    const od = MSG.orderDetails.get(name);
    const q = od && od.has(product) ? od.get(product) : 0;
    return typeof q === "number" ? q > 0 : !["", "0"].includes(cellStr(q).trim());
  };
  const names = [...MSG.messages.keys()].sort((a, b) =>
    ((hasOrder(a) ? 0 : 1) - (hasOrder(b) ? 0 : 1)) || cpCmp(a, b));
  renderList(names);
  setStatus("依產品排序完成");
});

$("m-export").addEventListener("click", () => {
  if (MSG.messages.size === 0) { alert("提示\n\n目前無任何訊息可供匯出。"); setStatus("無訊息匯出"); return; }
  try {
    let out = "";
    MSG.messages.forEach((message, name) => { out += `訂購人：${name}\n` + message + "\n" + "=".repeat(40) + "\n"; });
    download(new Blob([out], { type: "text/plain;charset=utf-8" }), "訂購訊息.txt");
    alert("提示\n\n訊息匯出成功。");
    setStatus("訊息匯出成功");
  } catch (err) {
    alert("錯誤\n\n匯出訊息時發生錯誤：" + err);
    setStatus("訊息匯出失敗");
  }
});

/* ═════════════════════════════════════════════════════════
   Tab 3：數量統計（對應 統計.py）
   ═════════════════════════════════════════════════════════ */
let orderCount = {};
let totalQty = 0;
const sMode = () => document.querySelector('input[name="s-mode"]:checked').value;

function calculateStatistics() {
  const text = $("s-input").value.normalize("NFKC");   // 全形 → 半形
  const tbody = document.querySelector("#s-table tbody");
  orderCount = {}; totalQty = 0; tbody.innerHTML = "";
  const addRow = (a, b) => { const r = tbody.insertRow(); r.insertCell().textContent = a; r.insertCell().textContent = b; };
  if (sMode() === "product") {
    const re = /([A-Za-z])\s*[+*]?\s*(\d+)/g;
    let m;
    while ((m = re.exec(text)) !== null) {
      const k = m[1].toUpperCase();
      orderCount[k] = (orderCount[k] || 0) + parseInt(m[2], 10);
    }
    Object.keys(orderCount).sort().forEach(k => addRow(k, orderCount[k]));
  } else {
    const re = /[+*]\s*(\d+)/g;
    let m;
    while ((m = re.exec(text)) !== null) totalQty += parseInt(m[1], 10);
    addRow("TOTAL", totalQty);
  }
}

$("s-calc").addEventListener("click", calculateStatistics);
$("s-copy").addEventListener("click", async () => {
  const content = sMode() === "product"
    ? Object.keys(orderCount).sort().map(k => `${k}.${orderCount[k]}`).join(",")
    : String(totalQty);
  await copyText(content);
  toast("結果已複製！");
});
$("s-clear").addEventListener("click", () => {
  $("s-input").value = "";
  document.querySelector("#s-table tbody").innerHTML = "";
  orderCount = {}; totalQty = 0;
});
</script>
